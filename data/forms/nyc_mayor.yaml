# NYC Mayor — nyc.gov contact form
# URL: https://www.nyc.gov/mayors-office/contact-the-mayor
# NOTE: Site returned 403 during audit — form structure was not inspectable.
# This is a best-guess stub that needs manual verification.
bioguide: nyc_mayor
contact_form:
  method: POST
  action: ""
  steps:
    - visit: "https://www.nyc.gov/mayors-office/contact-the-mayor"
    - wait:
        - value: 3
    - fill_in:
        - name: first_name
          selector: "input[name='first_name'], input[name='fname'], #first"
          value: "$NAME_FIRST"
          required: true
        - name: last_name
          selector: "input[name='last_name'], input[name='lname'], #last"
          value: "$NAME_LAST"
          required: true
        - name: email
          selector: "input[name='email'], input[type='email']"
          value: "$EMAIL"
          required: true
        - name: address
          selector: "input[name='address'], input[name='street']"
          value: "$ADDRESS_STREET"
          required: false
        - name: city
          selector: "input[name='city']"
          value: "$ADDRESS_CITY"
          required: false
        - name: zip
          selector: "input[name='zip'], input[name='zipcode']"
          value: "$ADDRESS_ZIP5"
          required: false
        - name: subject
          selector: "input[name='subject'], #subject"
          value: "$SUBJECT"
          required: false
        - name: message
          selector: "textarea[name='message'], textarea"
          value: "$MESSAGE"
          required: true
    - select:
        - name: topic
          selector: "select[name='topic'], select[name='category'], select[name='subject']"
          value: "$TOPIC"
          required: false
    - click_on:
        - value: "Submit"
          selector: "input[type='submit'], button[type='submit']"
    - wait:
        - value: 3
  success:
    body:
      contains: "Thank you"
  note: >
    THIS FORM NEEDS MANUAL VERIFICATION. The nyc.gov site returned 403 during audit.
    Form selectors are best-guess and must be validated against the live form.
    Fallback: provide phone (311) and mail (City Hall, New York, NY 10007).
