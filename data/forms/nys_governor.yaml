# NYS Governor — AEM contact form
# URL: https://www.governor.ny.gov/content/governor-contact-form
# NOTE: Form fields were not rendered during audit — needs manual verification.
# Platform is Adobe Experience Manager (AEM).
bioguide: nys_governor
contact_form:
  method: POST
  action: ""
  steps:
    - visit: "https://www.governor.ny.gov/content/governor-contact-form"
    - wait:
        - value: 3
    - fill_in:
        - name: first_name
          selector: "input[name='first_name'], input[name='firstName'], #first-name"
          value: "$NAME_FIRST"
          required: true
        - name: last_name
          selector: "input[name='last_name'], input[name='lastName'], #last-name"
          value: "$NAME_LAST"
          required: true
        - name: email
          selector: "input[name='email'], input[type='email']"
          value: "$EMAIL"
          required: true
        - name: address
          selector: "input[name='address'], input[name='street']"
          value: "$ADDRESS_STREET"
          required: false
        - name: city
          selector: "input[name='city']"
          value: "$ADDRESS_CITY"
          required: false
        - name: zip
          selector: "input[name='zip'], input[name='zipcode'], input[name='postalCode']"
          value: "$ADDRESS_ZIP5"
          required: false
        - name: subject
          selector: "input[name='subject'], #subject"
          value: "$SUBJECT"
          required: true
        - name: message
          selector: "textarea[name='message'], textarea[name='comments'], textarea"
          value: "$MESSAGE"
          required: true
    - select:
        - name: topic
          selector: "select[name='topic'], select[name='category']"
          value: "$TOPIC"
          required: false
    - click_on:
        - value: "Submit"
          selector: "input[type='submit'], button[type='submit']"
    - wait:
        - value: 3
  success:
    body:
      contains: "Thank you"
  note: >
    THIS FORM NEEDS MANUAL VERIFICATION. The AEM form did not render fields
    during audit. Selectors are best-guess. Fallback: phone (518-474-8390)
    or mail (NYS State Capitol Building, Albany, NY 12224).
